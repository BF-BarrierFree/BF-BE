name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy with SSM
        shell: bash
        run: |
          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -ex",
              "APP_DIR=/home/ubuntu/BF-BE",
              "SERVICE_NAME=bf-be",
              "echo '=== Starting deployment ==='",
              "date",
              "whoami",
              "test -d \"$APP_DIR/.git\"",
              "sudo -u ubuntu git -C \"$APP_DIR\" fetch --prune origin main",
              "sudo -u ubuntu git -C \"$APP_DIR\" checkout main",
              "sudo -u ubuntu git -C \"$APP_DIR\" reset --hard origin/main",
              "echo '=== Deployed commit ==='",
              "sudo -u ubuntu git -C \"$APP_DIR\" log -1 --oneline",
              "sudo -u ubuntu sh -c 'cd /home/ubuntu/BF-BE && chmod +x ./gradlew && ./gradlew clean bootJar -x test --no-daemon'",
              "systemctl restart \"$SERVICE_NAME\"",
              "sleep 10",
              "echo '=== Service status ==='",
              "systemctl status \"$SERVICE_NAME\" --no-pager -l || true",
              "echo '=== Recent service logs ==='",
              "journalctl -u \"$SERVICE_NAME\" -n 100 --no-pager || true",
              "systemctl is-active --quiet \"$SERVICE_NAME\"",
              "echo '=== Deployment successful ==='"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          SUCCESS=false

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              SUCCESS=true
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "TimedOut" ] || \
               [ "$STATUS" = "Cancelled" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --output json

              exit 1
            fi

            sleep 10
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Deployment did not finish within the expected time."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --output json

            exit 1
          fi

          echo "=== SSM deployment result ==="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --output json
