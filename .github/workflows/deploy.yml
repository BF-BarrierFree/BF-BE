name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy with SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters 'commands=[
              "set -e",
              "echo \"=== Starting deployment ===\"",
              "sudo -u ubuntu git -C /home/ubuntu/BF-BE fetch origin main",
              "sudo -u ubuntu git -C /home/ubuntu/BF-BE checkout main",
              "sudo -u ubuntu git -C /home/ubuntu/BF-BE reset --hard origin/main",
              "echo \"=== Deployed commit ===\"",
              "sudo -u ubuntu git -C /home/ubuntu/BF-BE log -1 --oneline",
              "sudo -u ubuntu bash -c \"cd /home/ubuntu/BF-BE && ./gradlew clean build -x test --no-daemon -Dorg.gradle.jvmargs=\\\"-Xmx512m\\\"\"",
              "systemctl restart bf-be",
              "sleep 10",
              "systemctl is-active --quiet bf-be",
              "echo \"=== Deployment successful ===\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          SUCCESS=false

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              SUCCESS=true
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "TimedOut" ] || \
               [ "$STATUS" = "Cancelled" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

              exit 1
            fi

            sleep 10
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Deployment did not finish within the expected time."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

            exit 1
          fi

          echo "=== SSM deployment result ==="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
