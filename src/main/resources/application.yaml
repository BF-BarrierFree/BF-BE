spring:
  datasource:
    # 시스템 속성(로컬) 또는 OS 환경 변수(배포)에서 가져옴
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # 배포 시 validate 필수
    properties:
      hibernate:
        show_sql: true # 배포 시 false로 바꿀 것
        format_sql: true # 배포 시 false로 바꿀 것
        use_sql_comments: true # 배포 시 false로 바꿀 것

  # --- 파일 업로드(Multipart) 용량 제한 설정 ---
  servlet:
    multipart:
      max-file-size: 20MB       # 파일 하나당 최대 허용 크기 (리뷰용 고화질 사진 대비)
      max-request-size: 100MB    # 한 번의 요청에 포함될 수 있는 전체 파일의 최대 크기 (다중 이미지 업로드 대비)

app:
  url: ${APP_URL:http://localhost:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- 외부 API 연동 설정 ---
google:
  places:
    # .env 파일 또는 시스템 환경 변수에 선언된 GOOGLE_MAP_API_KEY 값을 주입받습니다.
    # 추후 Service 클래스에서 @Value("${google.places.api-key}") 형태로 꺼내어 사용합니다.
    api-key: ${GOOGLE_MAP_API_KEY}

openrouteservice:
  base-url: https://api.openrouteservice.org
  api-key: ${ORS_API_KEY}

tago:
  api:
    base-url: https://apis.data.go.kr/1613000/ArvlInfoInqireService
    station-base-url: https://apis.data.go.kr/1613000/BusSttnInfoInqireService
    service-key: ${DATA_GO_KR_API_KEY}

odsay:
  api:
    base-url: https://api.odsay.com
    api-key: ${ODSAY_API_KEY}

kakao:
  mobility:
    base-url: https://apis-navi.kakaomobility.com
    api-key: ${KAKAO_MOBILITY_API_KEY}

mobility:
  api:
    base-url: https://apis.data.go.kr/B551982/tsdo_v2
    service-key: ${DATA_GO_KR_API_KEY}
